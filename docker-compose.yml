services:
  app:
    build: .
    image: kr2-app:1.0
    environment:
      REDIS_HOST: redis
      STUDENT: Sotnikova
    ports:
      - "127.0.0.1:8004:8004"
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
          
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - redis_data:/data
    env_file:
    - .env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  backend:

volumes:
  redis_data: